name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    types: [assigned, opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - ShineWifiX
          - lolin32
          - nodemcu-32s
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "FW_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "FW_VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pip-platformio-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade platformio

      - name: Build ${{ matrix.environment }}
        run: python -m platformio run -e ${{ matrix.environment }}

      - name: Rename firmware artifacts
        run: |
          mkdir -p firmware
          cp .pio/build/${{ matrix.environment }}/firmware.bin \
             firmware/firmware-${{ matrix.environment }}-${{ env.FW_VERSION }}.bin
          cp .pio/build/${{ matrix.environment }}/firmware.elf \
             firmware/firmware-${{ matrix.environment }}-${{ env.FW_VERSION }}.elf

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: firmware/
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: dist

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.bin
            dist/**/*.elf
